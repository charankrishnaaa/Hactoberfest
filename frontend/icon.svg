      <stop offset="0%" stop-color="#1a7940"/>
      <stop offset="100%" stop-color="#0d4722"/>
    </linearGradient>
    <linearGradient id="turbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
