<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f4a9e"/>
      <stop offset="100%" stop-color="#1d316e"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d3b"/>
      <stop offset="100%" stop-color="#f08a24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0e1730" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base (Safe for standard and maskable icons) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Saffron accent sound wave arches -->
  <circle cx="256" cy="246" r="160" fill="none" stroke="url(#saffronGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="70 40 120 40" opacity="0.85"/>
  <circle cx="256" cy="246" r="195" fill="none" stroke="#f08a24" stroke-width="8" stroke-linecap="round" stroke-dasharray="40 50 80 50" opacity="0.45"/>

  <!-- Center Glow Card -->
  <circle cx="256" cy="246" r="120" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Microphone & Speech Symbol -->
  <!-- Mic capsule -->
  <rect x="230" y="180" width="52" height="92" rx="26" fill="#2f4a9e"/>
  
  <!-- Mic cradle / holder -->
  <path d="M210 226 C210 274, 302 274, 302 226" fill="none" stroke="#2f4a9e" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Mic stem -->
  <path d="M256 270 L256 304" fill="none" stroke="#2f4a9e" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Mic base -->
  <path d="M228 304 L284 304" fill="none" stroke="#2f4a9e" stroke-width="14" stroke-linecap="round"/>

  <!-- Voice Wave Highlights in Saffron -->
  <path d="M190 230 C190 196, 190 180, 190 230" fill="none" stroke="#f08a24" stroke-width="10" stroke-linecap="round"/>
  <path d="M174 212 C166 226, 166 244, 174 258" fill="none" stroke="#f08a24" stroke-width="8" stroke-linecap="round"/>
  <path d="M338 212 C346 226, 346 244, 338 258" fill="none" stroke="#f08a24" stroke-width="8" stroke-linecap="round"/>

  <!-- Small text / identity dot -->
  <circle cx="256" cy="380" r="10" fill="#f08a24"/>
  <circle cx="228" cy="380" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="284" cy="380" r="6" fill="#ffffff" opacity="0.8"/>
</svg>
